[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchdesk"
version = "0.1.0"
description = "Rule-based research reports with passage-level provenance"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
researchdesk = "researchdesk.cli:main"

[tool.setuptools.packages.find]
include = ["researchdesk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
